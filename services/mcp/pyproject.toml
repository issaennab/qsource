[project]
name = "qsource-mcp"
version = "0.1.0"
description = "MCP server for QSource — agent access to versioned features and tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qsource-mcp = "qsource_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
