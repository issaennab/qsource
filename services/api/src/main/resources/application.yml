server:
  port: 8095

spring:
  application:
    name: qsource-api
  datasource:
    url: ${QSOURCE_DB_URL:jdbc:h2:file:./data/qsource;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${QSOURCE_DB_USER:sa}
    password: ${QSOURCE_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

qsource:
  seed: ${QSOURCE_SEED:true}
  jwt:
    secret: ${QSOURCE_JWT_SECRET:qsource-dev-secret-change-me-please-32chars-min}
    access-ttl-minutes: ${QSOURCE_JWT_ACCESS_TTL:60}
    refresh-ttl-days: ${QSOURCE_JWT_REFRESH_TTL:30}
