server:
  port: 8095

spring:
  application:
    name: coord-api
  datasource:
    url: ${COORD_DB_URL:jdbc:h2:file:./data/coord;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${COORD_DB_USER:sa}
    password: ${COORD_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

coord:
  seed: ${COORD_SEED:true}
